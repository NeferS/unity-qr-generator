# Builds Windows, Linux and Android players and publishes them as a GitHub Release.
#
# - Push a tag like v1.2.0 to build and publish the release for that version.
# - Run it manually from the Actions tab to only build and download the artifacts.
#
# Each platform is built by build.yml. Required repository secrets are listed in the README (section "Releases").

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a manual build (no release is published)"
        required: false
        default: "0.0.0"

permissions:
  contents: write

env:
  APP_NAME: QrGenerator

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

  # One job per platform instead of a matrix, so the installer only waits for the Windows build
  build-windows:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: Windows
      targetPlatform: StandaloneWindows64
      buildProfile: Assets/Settings/Build Profiles/Windows Profile.asset
      version: ${{ needs.version.outputs.version }}

  build-linux:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: Linux
      targetPlatform: StandaloneLinux64
      buildProfile: Assets/Settings/Build Profiles/Linux Profile.asset
      version: ${{ needs.version.outputs.version }}

  build-android:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      name: Android
      targetPlatform: Android
      buildProfile: Assets/Settings/Build Profiles/Android Profile.asset
      version: ${{ needs.version.outputs.version }}

  windows-installer:
    name: Package Windows
    needs: [version, build-windows]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Windows
          path: dist

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer and zip
        shell: pwsh
        run: |
          $source = "dist\$env:APP_NAME-Windows"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:VERSION" `
            "/DSourceDir=$((Resolve-Path $source).Path)" `
            "/DOutputDir=$((Resolve-Path .).Path)\out" `
            "/DOutputBaseFilename=$env:APP_NAME-$env:VERSION-Windows-Setup" `
            installer\QrGenerator.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$source\*" -DestinationPath "out\$env:APP_NAME-$env:VERSION-Windows.zip"
          Get-ChildItem out

      - uses: actions/upload-artifact@v7
        with:
          name: Windows-Release
          path: out
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [version, build-linux, build-android, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The unpacked Windows build is also downloaded, as a folder, and isn't matched here
      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*-Windows-Setup.exe
            artifacts/*-Windows.zip
            artifacts/*-Linux.tar.gz
            artifacts/*-Android.apk
